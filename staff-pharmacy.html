<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHA Pharmacy Department</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .pharmacy-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
            cursor: pointer;
        }

        .pharmacy-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="bg-blue-900 text-white shadow-lg">

        <div class="max-w-7xl mx-auto px-4">

            <div class="min-h-20 flex items-center justify-between gap-4">

                <div class="flex items-center gap-3">

                    <div
                        class="w-12 h-12 rounded-full bg-white
                               text-blue-900 flex items-center
                               justify-center font-black"
                    >
                        CHA
                    </div>

                    <div>

                        <div class="font-black">
                            COMMUNITY HOSPITAL AFARI
                        </div>

                        <div class="text-blue-200 text-sm">
                            Pharmacy Department
                        </div>

                    </div>

                </div>

                <button
                    id="backButton"
                    type="button"
                    class="bg-white text-blue-900
                           hover:bg-blue-50
                           px-4 py-2
                           rounded-lg
                           font-bold"
                >
                    ← Dashboard
                </button>

            </div>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="loading"
            class="bg-white rounded-2xl shadow p-8 text-center"
        >

            <div class="text-4xl">
                🔐
            </div>

            <p class="font-bold mt-3">
                Checking staff authentication...
            </p>

        </div>



        <!-- =================================================
             PHARMACY PAGE
        ================================================== -->

        <div
            id="pharmacyPage"
            class="hidden"
        >

            <!-- =================================================
                 WELCOME
            ================================================== -->

            <section
                class="bg-white rounded-2xl shadow p-6 mb-8"
            >

                <p class="text-sm text-slate-500">
                    Pharmacy Department
                </p>

                <h1
                    id="staffName"
                    class="text-3xl font-black mt-1"
                >
                    Staff Member
                </h1>

                <div class="flex flex-wrap gap-3 mt-4">

                    <span
                        id="staffRole"
                        class="bg-blue-100 text-blue-800
                               px-3 py-1
                               rounded-full
                               text-sm
                               font-bold"
                    ></span>

                    <span
                        id="staffDepartment"
                        class="bg-green-100 text-green-800
                               px-3 py-1
                               rounded-full
                               text-sm
                               font-bold"
                    ></span>

                </div>

            </section>



            <!-- =================================================
                 PHARMACY ACTIONS
            ================================================== -->

            <section
                class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"
            >

                <!-- MEDICATION RECORDS -->

                <button
                    id="medicationRecordsButton"
                    type="button"
                    class="pharmacy-card"
                >

                    <div class="text-4xl">
                        💊
                    </div>

                    <h2 class="font-black text-xl mt-4">
                        Medication Records
                    </h2>

                    <p class="text-slate-500 text-sm mt-2">
                        Access authorized medication records
                        and pharmacy information.
                    </p>

                </button>



                <!-- PRESCRIPTIONS -->

                <button
                    id="prescriptionsButton"
                    type="button"
                    class="pharmacy-card"
                >

                    <div class="text-4xl">
                        📋
                    </div>

                    <h2 class="font-black text-xl mt-4">
                        Prescriptions
                    </h2>

                    <p class="text-slate-500 text-sm mt-2">
                        Review authorized prescriptions and
                        medication requests.
                    </p>

                </button>



                <!-- DISPENSING -->

                <button
                    id="dispensingButton"
                    type="button"
                    class="pharmacy-card"
                >

                    <div class="text-4xl">
                        🧾
                    </div>

                    <h2 class="font-black text-xl mt-4">
                        Dispensing
                    </h2>

                    <p class="text-slate-500 text-sm mt-2">
                        Manage authorized medication dispensing
                        activities.
                    </p>

                </button>



                <!-- INVENTORY -->

                <button
                    id="inventoryButton"
                    type="button"
                    class="pharmacy-card"
                >

                    <div class="text-4xl">
                        📦
                    </div>

                    <h2 class="font-black text-xl mt-4">
                        Pharmacy Inventory
                    </h2>

                    <p class="text-slate-500 text-sm mt-2">
                        Monitor authorized medication stock
                        and inventory information.
                    </p>

                </button>



                <!-- PATIENT MEDICATION -->

                <button
                    id="patientMedicationButton"
                    type="button"
                    class="pharmacy-card"
                >

                    <div class="text-4xl">
                        🧑‍⚕️
                    </div>

                    <h2 class="font-black text-xl mt-4">
                        Patient Medication
                    </h2>

                    <p class="text-slate-500 text-sm mt-2">
                        Access medication information for
                        authorized patients.
                    </p>

                </button>



                <!-- PHARMACY NOTES -->

                <button
                    id="pharmacyNotesButton"
                    type="button"
                    class="pharmacy-card"
                >

                    <div class="text-4xl">
                        📝
                    </div>

                    <h2 class="font-black text-xl mt-4">
                        Pharmacy Notes
                    </h2>

                    <p class="text-slate-500 text-sm mt-2">
                        Record or review authorized pharmacy
                        notes and activities.
                    </p>

                </button>

            </section>



            <!-- =================================================
                 QUICK ACCESS
            ================================================== -->

            <section
                class="mt-8 bg-white rounded-2xl shadow p-6"
            >

                <h2 class="text-xl font-black">
                    ⚡ Quick Access
                </h2>

                <div
                    class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-5"
                >

                    <button
                        id="quickPrescriptionsButton"
                        type="button"
                        class="bg-blue-50
                               border border-blue-100
                               rounded-xl
                               p-4
                               text-left
                               hover:bg-blue-100"
                    >

                        <div class="text-2xl">
                            📋
                        </div>

                        <div class="font-black mt-2">
                            Prescriptions
                        </div>

                    </button>



                    <button
                        id="quickInventoryButton"
                        type="button"
                        class="bg-green-50
                               border border-green-100
                               rounded-xl
                               p-4
                               text-left
                               hover:bg-green-100"
                    >

                        <div class="text-2xl">
                            📦
                        </div>

                        <div class="font-black mt-2">
                            Inventory
                        </div>

                    </button>



                    <button
                        id="quickPatientMedicationButton"
                        type="button"
                        class="bg-purple-50
                               border border-purple-100
                               rounded-xl
                               p-4
                               text-left
                               hover:bg-purple-100"
                    >

                        <div class="text-2xl">
                            🧑‍⚕️
                        </div>

                        <div class="font-black mt-2">
                            Patient Medication
                        </div>

                    </button>



                    <button
                        id="quickDashboardButton"
                        type="button"
                        class="bg-slate-50
                               border border-slate-200
                               rounded-xl
                               p-4
                               text-left
                               hover:bg-slate-100"
                    >

                        <div class="text-2xl">
                            🏠
                        </div>

                        <div class="font-black mt-2">
                            Staff Dashboard
                        </div>

                    </button>

                </div>

            </section>



            <!-- =================================================
                 SECURITY NOTICE
            ================================================== -->

            <section
                class="mt-8
                       bg-blue-50
                       border border-blue-100
                       rounded-2xl
                       p-6"
            >

                <h2 class="font-black text-lg">
                    🔐 Pharmacy Security
                </h2>

                <p class="text-sm text-blue-900 mt-2">
                    Pharmacy information is confidential.
                    Only access medication and patient information
                    required for legitimate hospital duties.
                </p>

            </section>

        </div>

    </main>



    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="js/supabase.js"></script>



    <!-- =====================================================
         PHARMACY LOGIC
    ====================================================== -->

    <script>

        "use strict";


        // ====================================================
        // ELEMENTS
        // ====================================================

        const loading =
            document.getElementById("loading");

        const pharmacyPage =
            document.getElementById("pharmacyPage");

        const staffName =
            document.getElementById("staffName");

        const staffRole =
            document.getElementById("staffRole");

        const staffDepartment =
            document.getElementById("staffDepartment");

        const backButton =
            document.getElementById("backButton");



        const medicationRecordsButton =
            document.getElementById(
                "medicationRecordsButton"
            );

        const prescriptionsButton =
            document.getElementById(
                "prescriptionsButton"
            );

        const dispensingButton =
            document.getElementById(
                "dispensingButton"
            );

        const inventoryButton =
            document.getElementById(
                "inventoryButton"
            );

        const patientMedicationButton =
            document.getElementById(
                "patientMedicationButton"
            );

        const pharmacyNotesButton =
            document.getElementById(
                "pharmacyNotesButton"
            );



        const quickPrescriptionsButton =
            document.getElementById(
                "quickPrescriptionsButton"
            );

        const quickInventoryButton =
            document.getElementById(
                "quickInventoryButton"
            );

        const quickPatientMedicationButton =
            document.getElementById(
                "quickPatientMedicationButton"
            );

        const quickDashboardButton =
            document.getElementById(
                "quickDashboardButton"
            );



        // ====================================================
        // ESCAPE HTML
        // ====================================================

        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }



        // ====================================================
        // DASHBOARD NAVIGATION
        // ====================================================

        function goToDashboard() {

            window.location.href =
                "staff-dashboard.html";

        }


        backButton.addEventListener(
            "click",
            goToDashboard
        );


        quickDashboardButton.addEventListener(
            "click",
            goToDashboard
        );



        // ====================================================
        // MODAL
        // ====================================================

        function showModuleMessage(
            icon,
            title,
            message
        ) {

            const existing =
                document.getElementById(
                    "pharmacyModuleModal"
                );

            if (existing) {

                existing.remove();

            }


            const modal =
                document.createElement("div");

            modal.id =
                "pharmacyModuleModal";

            modal.className =
                "fixed inset-0 z-50 bg-black/50 " +
                "flex items-center justify-center p-4";


            modal.innerHTML = `

                <div
                    class="
                        bg-white
                        rounded-2xl
                        shadow-2xl
                        max-w-lg
                        w-full
                        p-6
                    "
                >

                    <div class="text-4xl">
                        ${icon}
                    </div>

                    <h2
                        class="
                            text-2xl
                            font-black
                            mt-3
                        "
                    >
                        ${escapeHTML(title)}
                    </h2>

                    <p
                        class="
                            text-slate-600
                            mt-3
                            leading-7
                        "
                    >
                        ${escapeHTML(message)}
                    </p>

                    <button
                        id="closePharmacyModal"
                        type="button"
                        class="
                            mt-6
                            w-full
                            bg-blue-900
                            hover:bg-blue-800
                            text-white
                            px-5
                            py-3
                            rounded-xl
                            font-black
                        "
                    >
                        Close
                    </button>

                </div>

            `;


            document.body.appendChild(modal);


            document
                .getElementById(
                    "closePharmacyModal"
                )
                .addEventListener(
                    "click",
                    function() {

                        modal.remove();

                    }
                );


            modal.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        modal
                    ) {

                        modal.remove();

                    }

                }
            );

        }



        // ====================================================
        // PHARMACY MODULES
        // ====================================================

        function openMedicationRecords() {

            showModuleMessage(
                "💊",
                "Medication Records",
                "The Medication Records module is connected to the Pharmacy dashboard and is ready to be connected to the authorized hospital medication database."
            );

        }



        function openPrescriptions() {

            showModuleMessage(
                "📋",
                "Prescriptions",
                "The Prescriptions module is ready to display authorized prescriptions from the hospital system."
            );

        }



        function openDispensing() {

            showModuleMessage(
                "🧾",
                "Medication Dispensing",
                "The Medication Dispensing module is ready to be connected to authorized pharmacy dispensing records."
            );

        }



        function openInventory() {

            showModuleMessage(
                "📦",
                "Pharmacy Inventory",
                "The Pharmacy Inventory module is ready to be connected to authorized medication stock records."
            );

        }



        function openPatientMedication() {

            showModuleMessage(
                "🧑‍⚕️",
                "Patient Medication",
                "The Patient Medication module is ready to be connected to authorized patient medication records."
            );

        }



        function openPharmacyNotes() {

            showModuleMessage(
                "📝",
                "Pharmacy Notes",
                "The Pharmacy Notes module is ready to be connected to authorized pharmacy documentation."
            );

        }



        // ====================================================
        // BUTTON EVENTS
        // ====================================================

        medicationRecordsButton.addEventListener(
            "click",
            openMedicationRecords
        );


        prescriptionsButton.addEventListener(
            "click",
            openPrescriptions
        );


        dispensingButton.addEventListener(
            "click",
            openDispensing
        );


        inventoryButton.addEventListener(
            "click",
            openInventory
        );


        patientMedicationButton.addEventListener(
            "click",
            openPatientMedication
        );


        pharmacyNotesButton.addEventListener(
            "click",
            openPharmacyNotes
        );


        quickPrescriptionsButton.addEventListener(
            "click",
            openPrescriptions
        );


        quickInventoryButton.addEventListener(
            "click",
            openInventory
        );


        quickPatientMedicationButton.addEventListener(
            "click",
            openPatientMedication
        );



        // ====================================================
        // LOAD PHARMACY PAGE
        // ====================================================

        async function loadPharmacyPage() {

            try {

                // --------------------------------------------
                // CHECK SUPABASE
                // --------------------------------------------

                if (
                    !window.CHA_SUPABASE
                ) {

                    throw new Error(
                        "Supabase is not configured."
                    );

                }



                // --------------------------------------------
                // AUTHENTICATION
                // --------------------------------------------

                const {
                    data: authData,
                    error: authError
                } =
                    await window.CHA_SUPABASE
                        .auth
                        .getUser();



                if (
                    authError ||
                    !authData ||
                    !authData.user
                ) {

                    window.location.href =
                        "staff-login.html";

                    return;

                }



                const user =
                    authData.user;



                // --------------------------------------------
                // STAFF PROFILE
                // --------------------------------------------

                const {
                    data: profile,
                    error: profileError
                } =
                    await window.CHA_SUPABASE
                        .from("staff_profiles")
                        .select(`
                            id,
                            full_name,
                            role,
                            is_active,
                            department_id,
                            departments (
                                name
                            )
                        `)
                        .eq(
                            "id",
                            user.id
                        )
                        .single();



                if (profileError) {

                    throw profileError;

                }



                // --------------------------------------------
                // ACTIVE STAFF CHECK
                // --------------------------------------------

                if (
                    !profile ||
                    profile.is_active !== true
                ) {

                    await window.CHA_SUPABASE
                        .auth
                        .signOut();

                    window.location.href =
                        "staff-login.html";

                    return;

                }



                // --------------------------------------------
                // DISPLAY STAFF
                // --------------------------------------------

                staffName.textContent =
                    profile.full_name ||
                    "Staff Member";


                staffRole.textContent =
                    "Role: " +
                    (
                        profile.role ||
                        "Staff"
                    );


                staffDepartment.textContent =
                    "Department: " +
                    (
                        profile.departments?.name ||
                        "Not assigned"
                    );



                // --------------------------------------------
                // SHOW PAGE
                // --------------------------------------------

                loading.classList.add(
                    "hidden"
                );

                pharmacyPage.classList.remove(
                    "hidden"
                );

            }

            catch (error) {

                console.error(
                    "CHA Pharmacy Error:",
                    error
                );


                loading.innerHTML = `

                    <div class="text-4xl">
                        ⚠️
                    </div>

                    <p
                        class="
                            font-bold
                            mt-3
                            text-red-700
                        "
                    >
                        Unable to load Pharmacy Department
                    </p>

                    <p
                        class="
                            text-sm
                            text-slate-500
                            mt-2
                        "
                    >
                        ${escapeHTML(
                            error.message ||
                            "Please try again."
                        )}
                    </p>

                    <button
                        type="button"
                        id="returnLoginButton"
                        class="
                            mt-5
                            bg-blue-900
                            hover:bg-blue-800
                            text-white
                            px-5
                            py-3
                            rounded-xl
                            font-bold
                        "
                    >
                        Return to Login
                    </button>

                `;


                const returnLoginButton =
                    document.getElementById(
                        "returnLoginButton"
                    );


                if (returnLoginButton) {

                    returnLoginButton.addEventListener(
                        "click",
                        function() {

                            window.location.href =
                                "staff-login.html";

                        }
                    );

                }

            }

        }



        // ====================================================
        // INITIALIZE
        // ====================================================

        loadPharmacyPage();

    </script>

</body>
</html>
