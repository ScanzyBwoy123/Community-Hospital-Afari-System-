<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CHA Pharmacy Department</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .pharmacy-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
            cursor: pointer;
        }

        .pharmacy-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.08);
        }

        .modal-backdrop {
            background: rgba(15, 23, 42, 0.55);
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="bg-blue-900 text-white shadow-lg">

        <div class="max-w-7xl mx-auto px-4">

            <div class="min-h-20 flex items-center justify-between gap-4">

                <div class="flex items-center gap-3">

                    <div
                        class="w-12 h-12 rounded-full bg-white
                               text-blue-900 flex items-center
                               justify-center font-black"
                    >
                        CHA
                    </div>

                    <div>

                        <div class="font-black">
                            COMMUNITY HOSPITAL AFARI
                        </div>

                        <div class="text-blue-200 text-sm">
                            Pharmacy Department
                        </div>

                    </div>

                </div>

                <button
                    id="backButton"
                    type="button"
                    class="
                        bg-white
                        text-blue-900
                        hover:bg-blue-50
                        px-4
                        py-2
                        rounded-lg
                        font-bold
                    "
                >
                    ← Dashboard
                </button>

            </div>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="loading"
            class="bg-white rounded-2xl shadow p-8 text-center"
        >

            <div class="text-4xl">
                🔐
            </div>

            <p class="font-bold mt-3">
                Checking staff authentication...
            </p>

        </div>



        <!-- =================================================
             PHARMACY PAGE
        ================================================== -->

        <div
            id="pharmacyPage"
            class="hidden"
        >

            <!-- =================================================
                 WELCOME
            ================================================== -->

            <section
                class="bg-white rounded-2xl shadow p-6 mb-8"
            >

                <p class="text-sm text-slate-500">
                    Pharmacy Department
                </p>

                <h1
                    id="staffName"
                    class="text-3xl font-black mt-1"
                >
                    Staff Member
                </h1>

                <div class="flex flex-wrap gap-3 mt-4">

                    <span
                        id="staffRole"
                        class="
                            bg-blue-100
                            text-blue-800
                            px-3
                            py-1
                            rounded-full
                            text-sm
                            font-bold
                        "
                    ></span>

                    <span
                        id="staffDepartment"
                        class="
                            bg-green-100
                            text-green-800
                            px-3
                            py-1
                            rounded-full
                            text-sm
                            font-bold
                        "
                    ></span>

                </div>

            </section>



            <!-- =================================================
                 PHARMACY CARDS
            ================================================== -->

            <section
                class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"
            >

                <!-- =================================================
                     MEDICATION RECORDS
                ================================================== -->

                <button
                    id="medicationRecordsButton"
                    type="button"
                    class="pharmacy-card"
                >

                    <div class="text-4xl">
                        💊
                    </div>

                    <h2 class="font-black text-xl mt-4">
                        Medication Records
                    </h2>

                    <p class="text-slate-500 text-sm mt-2">
                        Add, search, edit and manage authorized
                        medication records.
                    </p>

                </button>



                <!-- =================================================
                     PRESCRIPTIONS
                ================================================== -->

                <button
                    id="prescriptionsButton"
                    type="button"
                    class="pharmacy-card"
                >

                    <div class="text-4xl">
                        📋
                    </div>

                    <h2 class="font-black text-xl mt-4">
                        Prescriptions
                    </h2>

                    <p class="text-slate-500 text-sm mt-2">
                        Manage authorized prescriptions.
                    </p>

                </button>



                <!-- =================================================
                     DISPENSING
                ================================================== -->

                <button
                    id="dispensingButton"
                    type="button"
                    class="pharmacy-card"
                >

                    <div class="text-4xl">
                        🧾
                    </div>

                    <h2 class="font-black text-xl mt-4">
                        Dispensing
                    </h2>

                    <p class="text-slate-500 text-sm mt-2">
                        Record authorized medication dispensing.
                    </p>

                </button>



                <!-- =================================================
                     INVENTORY
                ================================================== -->

                <button
                    id="inventoryButton"
                    type="button"
                    class="pharmacy-card"
                >

                    <div class="text-4xl">
                        📦
                    </div>

                    <h2 class="font-black text-xl mt-4">
                        Pharmacy Inventory
                    </h2>

                    <p class="text-slate-500 text-sm mt-2">
                        Monitor medication stock and inventory.
                    </p>

                </button>



                <!-- =================================================
                     PATIENT MEDICATION
                ================================================== -->

                <button
                    id="patientMedicationButton"
                    type="button"
                    class="pharmacy-card"
                >

                    <div class="text-4xl">
                        🧑‍⚕️
                    </div>

                    <h2 class="font-black text-xl mt-4">
                        Patient Medication
                    </h2>

                    <p class="text-slate-500 text-sm mt-2">
                        Access authorized patient medication
                        information.
                    </p>

                </button>



                <!-- =================================================
                     PHARMACY NOTES
                ================================================== -->

                <button
                    id="pharmacyNotesButton"
                    type="button"
                    class="pharmacy-card"
                >

                    <div class="text-4xl">
                        📝
                    </div>

                    <h2 class="font-black text-xl mt-4">
                        Pharmacy Notes
                    </h2>

                    <p class="text-slate-500 text-sm mt-2">
                        Record authorized pharmacy documentation.
                    </p>

                </button>

            </section>



            <!-- =================================================
                 QUICK ACCESS
            ================================================== -->

            <section
                class="mt-8 bg-white rounded-2xl shadow p-6"
            >

                <h2 class="text-xl font-black">
                    ⚡ Quick Access
                </h2>

                <div
                    class="
                        grid
                        sm:grid-cols-2
                        lg:grid-cols-4
                        gap-4
                        mt-5
                    "
                >

                    <button
                        id="quickMedicationButton"
                        type="button"
                        class="
                            bg-blue-50
                            border
                            border-blue-100
                            rounded-xl
                            p-4
                            text-left
                            hover:bg-blue-100
                        "
                    >

                        <div class="text-2xl">
                            💊
                        </div>

                        <div class="font-black mt-2">
                            Medication Records
                        </div>

                    </button>



                    <button
                        id="quickPrescriptionsButton"
                        type="button"
                        class="
                            bg-purple-50
                            border
                            border-purple-100
                            rounded-xl
                            p-4
                            text-left
                            hover:bg-purple-100
                        "
                    >

                        <div class="text-2xl">
                            📋
                        </div>

                        <div class="font-black mt-2">
                            Prescriptions
                        </div>

                    </button>



                    <button
                        id="quickInventoryButton"
                        type="button"
                        class="
                            bg-green-50
                            border
                            border-green-100
                            rounded-xl
                            p-4
                            text-left
                            hover:bg-green-100
                        "
                    >

                        <div class="text-2xl">
                            📦
                        </div>

                        <div class="font-black mt-2">
                            Inventory
                        </div>

                    </button>



                    <button
                        id="quickDashboardButton"
                        type="button"
                        class="
                            bg-slate-50
                            border
                            border-slate-200
                            rounded-xl
                            p-4
                            text-left
                            hover:bg-slate-100
                        "
                    >

                        <div class="text-2xl">
                            🏠
                        </div>

                        <div class="font-black mt-2">
                            Staff Dashboard
                        </div>

                    </button>

                </div>

            </section>



            <!-- =================================================
                 SECURITY NOTICE
            ================================================== -->

            <section
                class="
                    mt-8
                    bg-blue-50
                    border
                    border-blue-100
                    rounded-2xl
                    p-6
                "
            >

                <h2 class="font-black text-lg">
                    🔐 Pharmacy Security
                </h2>

                <p class="text-sm text-blue-900 mt-2">
                    Pharmacy and patient information is confidential.
                    Only access information required for legitimate
                    hospital duties.
                </p>

            </section>

        </div>

    </main>



    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="js/supabase.js"></script>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        "use strict";


        // ====================================================
        // ELEMENTS
        // ====================================================

        const loading =
            document.getElementById("loading");

        const pharmacyPage =
            document.getElementById("pharmacyPage");

        const staffName =
            document.getElementById("staffName");

        const staffRole =
            document.getElementById("staffRole");

        const staffDepartment =
            document.getElementById("staffDepartment");

        const backButton =
            document.getElementById("backButton");

        const medicationRecordsButton =
            document.getElementById(
                "medicationRecordsButton"
            );

        const prescriptionsButton =
            document.getElementById(
                "prescriptionsButton"
            );

        const dispensingButton =
            document.getElementById(
                "dispensingButton"
            );

        const inventoryButton =
            document.getElementById(
                "inventoryButton"
            );

        const patientMedicationButton =
            document.getElementById(
                "patientMedicationButton"
            );

        const pharmacyNotesButton =
            document.getElementById(
                "pharmacyNotesButton"
            );

        const quickMedicationButton =
            document.getElementById(
                "quickMedicationButton"
            );

        const quickPrescriptionsButton =
            document.getElementById(
                "quickPrescriptionsButton"
            );

        const quickInventoryButton =
            document.getElementById(
                "quickInventoryButton"
            );

        const quickDashboardButton =
            document.getElementById(
                "quickDashboardButton"
            );



        // ====================================================
        // HTML ESCAPING
        // ====================================================

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }



        // ====================================================
        // DASHBOARD
        // ====================================================

        function goToDashboard() {

            window.location.href =
                "staff-dashboard.html";

        }


        backButton.addEventListener(
            "click",
            goToDashboard
        );


        quickDashboardButton.addEventListener(
            "click",
            goToDashboard
        );



        // ====================================================
        // MODAL
        // ====================================================

        function closeModal() {

            const modal =
                document.getElementById(
                    "pharmacyModal"
                );

            if (modal) {

                modal.remove();

            }

        }



        function createModal(
            title,
            content
        ) {

            closeModal();

            const modal =
                document.createElement("div");

            modal.id =
                "pharmacyModal";

            modal.className =
                "fixed inset-0 z-50 modal-backdrop " +
                "flex items-center justify-center p-4";


            modal.innerHTML = `

                <div
                    class="
                        bg-white
                        rounded-2xl
                        shadow-2xl
                        w-full
                        max-w-6xl
                        max-h-[90vh]
                        overflow-hidden
                        flex
                        flex-col
                    "
                >

                    <div
                        class="
                            flex
                            items-center
                            justify-between
                            gap-4
                            p-5
                            border-b
                            border-slate-200
                        "
                    >

                        <h2
                            class="
                                text-2xl
                                font-black
                            "
                        >
                            ${escapeHTML(title)}
                        </h2>

                        <button
                            id="pharmacyModalClose"
                            type="button"
                            class="
                                text-slate-500
                                hover:text-slate-900
                                text-2xl
                                font-bold
                                px-2
                            "
                        >
                            ×
                        </button>

                    </div>

                    <div
                        class="
                            p-5
                            overflow-y-auto
                        "
                    >
                        ${content}
                    </div>

                </div>

            `;


            document.body.appendChild(modal);


            document
                .getElementById(
                    "pharmacyModalClose"
                )
                .addEventListener(
                    "click",
                    closeModal
                );


            modal.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        modal
                    ) {

                        closeModal();

                    }

                }
            );

        }



        // ====================================================
        // MEDICATION RECORDS
        // ====================================================

        async function openMedicationRecords() {

            createModal(
                "💊 Medication Records",
                `
                    <div
                        id="medicationRecordsContent"
                        class="text-center py-8"
                    >

                        <div class="text-3xl">
                            ⏳
                        </div>

                        <p class="font-bold mt-3">
                            Loading medication records...
                        </p>

                    </div>
                `
            );


            await loadMedicationRecords();

        }



        async function loadMedicationRecords() {

            const container =
                document.getElementById(
                    "medicationRecordsContent"
                );


            if (!container) {

                return;

            }


            try {

                if (
                    !window.CHA_SUPABASE
                ) {

                    throw new Error(
                        "Supabase is not configured."
                    );

                }


                const {
                    data,
                    error
                } =
                    await window.CHA_SUPABASE
                        .from("medications")
                        .select(`
                            id,
                            name,
                            generic_name,
                            strength,
                            dosage_form,
                            quantity,
                            unit,
                            expiry_date,
                            batch_number,
                            created_at
                        `)
                        .order(
                            "name",
                            {
                                ascending: true
                            }
                        );


                if (error) {

                    throw error;

                }


                const medications =
                    data || [];


                container.innerHTML = `

                    <div class="space-y-5">

                        <div
                            class="
                                flex
                                flex-col
                                sm:flex-row
                                gap-3
                                justify-between
                            "
                        >

                            <input
                                id="medicationSearch"
                                type="search"
                                placeholder="Search medications..."
                                class="
                                    w-full
                                    sm:max-w-md
                                    border
                                    border-slate-300
                                    rounded-xl
                                    px-4
                                    py-3
                                    outline-none
                                    focus:ring-2
                                    focus:ring-blue-500
                                "
                            >

                            <button
                                id="addMedicationButton"
                                type="button"
                                class="
                                    bg-blue-900
                                    hover:bg-blue-800
                                    text-white
                                    px-5
                                    py-3
                                    rounded-xl
                                    font-black
                                "
                            >
                                + Add Medication
                            </button>

                        </div>


                        <div
                            id="medicationTableArea"
                        ></div>

                    </div>

                `;


                renderMedicationTable(
                    medications
                );


                const searchInput =
                    document.getElementById(
                        "medicationSearch"
                    );


                searchInput.addEventListener(
                    "input",
                    function() {

                        const search =
                            this.value
                                .trim()
                                .toLowerCase();


                        const filtered =
                            medications.filter(
                                function(item) {

                                    return [
                                        item.name,
                                        item.generic_name,
                                        item.strength,
                                        item.dosage_form,
                                        item.batch_number
                                    ]
                                    .some(
                                        function(value) {

                                            return String(
                                                value ?? ""
                                            )
                                            .toLowerCase()
                                            .includes(
                                                search
                                            );

                                        }
                                    );

                                }
                            );


                        renderMedicationTable(
                            filtered
                        );

                    }
                );


                document
                    .getElementById(
                        "addMedicationButton"
                    )
                    .addEventListener(
                        "click",
                        showAddMedicationForm
                    );

            }

            catch (error) {

                console.error(
                    "Medication Records Error:",
                    error
                );


                container.innerHTML = `

                    <div
                        class="
                            bg-red-50
                            border
                            border-red-200
                            rounded-xl
                            p-5
                        "
                    >

                        <div class="text-3xl">
                            ⚠️
                        </div>

                        <p
                            class="
                                font-black
                                text-red-700
                                mt-2
                            "
                        >
                            Unable to load medications
                        </p>

                        <p
                            class="
                                text-sm
                                text-red-600
                                mt-2
                            "
                        >
                            ${escapeHTML(
                                error.message ||
                                "Please try again."
                            )}
                        </p>

                    </div>

                `;

            }

        }



        // ====================================================
        // MEDICATION TABLE
        // ====================================================

        function renderMedicationTable(
            medications
        ) {

            const area =
                document.getElementById(
                    "medicationTableArea"
                );


            if (!area) {

                return;

            }


            if (!medications.length) {

                area.innerHTML = `

                    <div
                        class="
                            bg-slate-50
                            border
                            border-slate-200
                            rounded-xl
                            p-8
                            text-center
                        "
                    >

                        <div class="text-4xl">
                            💊
                        </div>

                        <p class="font-black mt-3">
                            No medication records found
                        </p>

                        <p
                            class="
                                text-sm
                                text-slate-500
                                mt-2
                            "
                        >
                            Add your first medication record.
                        </p>

                    </div>

                `;

                return;

            }


            area.innerHTML = `

                <div
                    class="
                        overflow-x-auto
                        border
                        border-slate-200
                        rounded-xl
                    "
                >

                    <table
                        class="
                            min-w-full
                            text-sm
                        "
                    >

                        <thead
                            class="
                                bg-slate-100
                                border-b
                                border-slate-200
                            "
                        >

                            <tr>

                                <th
                                    class="
                                        text-left
                                        px-4
                                        py-3
                                        font-black
                                    "
                                >
                                    Medication
                                </th>

                                <th
                                    class="
                                        text-left
                                        px-4
                                        py-3
                                        font-black
                                    "
                                >
                                    Strength
                                </th>

                                <th
                                    class="
                                        text-left
                                        px-4
                                        py-3
                                        font-black
                                    "
                                >
                                    Form
                                </th>

                                <th
                                    class="
                                        text-left
                                        px-4
                                        py-3
                                        font-black
                                    "
                                >
                                    Quantity
                                </th>

                                <th
                                    class="
                                        text-left
                                        px-4
                                        py-3
                                        font-black
                                    "
                                >
                                    Expiry
                                </th>

                                <th
                                    class="
                                        text-left
                                        px-4
                                        py-3
                                        font-black
                                    "
                                >
                                    Action
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            ${medications
                                .map(
                                    function(item) {

                                        return `

                                            <tr
                                                class="
                                                    border-b
                                                    border-slate-100
                                                    hover:bg-slate-50
                                                "
                                            >

                                                <td
                                                    class="
                                                        px-4
                                                        py-4
                                                    "
                                                >

                                                    <div
                                                        class="
                                                            font-black
                                                        "
                                                    >
                                                        ${escapeHTML(
                                                            item.name
                                                        )}
                                                    </div>

                                                    ${
                                                        item.generic_name
                                                        ?
                                                        `
                                                            <div
                                                                class="
                                                                    text-xs
                                                                    text-slate-500
                                                                    mt-1
                                                                "
                                                            >
                                                                ${escapeHTML(
                                                                    item.generic_name
                                                                )}
                                                            </div>
                                                        `
                                                        :
                                                        ""
                                                    }

                                                </td>


                                                <td
                                                    class="
                                                        px-4
                                                        py-4
                                                    "
                                                >
                                                    ${escapeHTML(
                                                        item.strength ||
                                                        "—"
                                                    )}
                                                </td>


                                                <td
                                                    class="
                                                        px-4
                                                        py-4
                                                    "
                                                >
                                                    ${escapeHTML(
                                                        item.dosage_form ||
                                                        "—"
                                                    )}
                                                </td>


                                                <td
                                                    class="
                                                        px-4
                                                        py-4
                                                        font-bold
                                                    "
                                                >
                                                    ${escapeHTML(
                                                        item.quantity
                                                    )}
                                                    ${escapeHTML(
                                                        item.unit ||
                                                        "unit"
                                                    )}
                                                </td>


                                                <td
                                                    class="
                                                        px-4
                                                        py-4
                                                    "
                                                >
                                                    ${escapeHTML(
                                                        item.expiry_date ||
                                                        "—"
                                                    )}
                                                </td>


                                                <td
                                                    class="
                                                        px-4
                                                        py-4
                                                    "
                                                >

                                                    <button
                                                        type="button"
                                                        class="
                                                            edit-medication-button
                                                            bg-blue-100
                                                            text-blue-800
                                                            hover:bg-blue-200
                                                            px-3
                                                            py-2
                                                            rounded-lg
                                                            font-bold
                                                        "
                                                        data-id="${escapeHTML(
                                                            item.id
                                                        )}"
                                                    >
                                                        Edit
                                                    </button>

                                                </td>

                                            </tr>

                                        `;

                                    }
                                )
                                .join("")}

                        </tbody>

                    </table>

                </div>

            `;


            area
                .querySelectorAll(
                    ".edit-medication-button"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            function() {

                                openEditMedicationForm(
                                    this.dataset.id
                                );

                            }
                        );

                    }
                );

        }



        // ====================================================
        // ADD MEDICATION FORM
        // ====================================================

        function showAddMedicationForm() {

            const content =
                document.getElementById(
                    "medicationRecordsContent"
                );


            if (!content) {

                return;

            }


            content.innerHTML = `

                <form
                    id="addMedicationForm"
                    class="space-y-5"
                >

                    <div
                        class="
                            grid
                            md:grid-cols-2
                            gap-4
                        "
                    >

                        <div>

                            <label
                                class="
                                    block
                                    font-bold
                                    text-sm
                                    mb-2
                                "
                            >
                                Medication Name *
                            </label>

                            <input
                                name="name"
                                required
                                type="text"
                                class="
                                    w-full
                                    border
                                    border-slate-300
                                    rounded-xl
                                    px-4
                                    py-3
                                "
                                placeholder="e.g. Paracetamol"
                            >

                        </div>


                        <div>

                            <label

        // ====================================================

        async function saveNewMedication(
            event
        ) {

            event.preventDefault();


            const form =
                event.target;

            const formData =
                new FormData(form);


            const message =
                document.getElementById(
                    "medicationFormMessage"
                );


            try {

                const quantity =
                    Number(
                        formData.get(
                            "quantity"
                        )
                    );


                if (
                    !Number.isInteger(
                        quantity
                    ) ||
                    quantity < 0
                ) {

                    throw new Error(
                        "Quantity must be a whole number of 0 or more."
                    );

                }


                const payload = {

                    name:
                        String(
                            formData.get(
                                "name"
                            ) || ""
                        ).trim(),

                    generic_name:
                        String(
                            formData.get(
                                "generic_name"
                            ) || ""
                        ).trim() ||
                        null,

                    strength:
                        String(
                            formData.get(
                                "strength"
                            ) || ""
                        ).trim() ||
                        null,

                    dosage_form:
                        String(
                            formData.get(
                                "dosage_form"
                            ) || ""
                        ).trim() ||
                        null,

                    quantity:
                        quantity,

                    unit:
                        String(
                            formData.get(
                                "unit"
                            ) || "unit"
                        ).trim() ||
                        "unit",

                    expiry_date:
                        formData.get(
                            "expiry_date"
                        ) ||
                        null,

                    batch_number:
                        String(
                            formData.get(
                                "batch_number"
                            ) || ""
                        ).trim() ||
                        null

                };


                if (!payload.name) {

                    throw new Error(
                        "Medication name is required."
                    );

                }


                const {
                    error
                } =
                    await window.CHA_SUPABASE
                        .from("medications")
                        .insert(
                            payload
                        );


                if (error) {

                    throw error;

                }


                message.innerHTML = `

                    <div
                        class="

                            border-green-200

        }

        // ====================================================
        // DELETE MEDICATION
        // ====================================================

        async function deleteMedication(
            id
        ) {

            const confirmed =
                window.confirm(
                    "Are you sure you want to delete this medication record?"
                );


            if (!confirmed) {

                return;

            }


            try {

                const {
                    error
                } =
                    await window.CHA_SUPABASE
                        .from("medications")
                        .delete()
                        .eq(
                            "id",
                            id
                        );


                if (error) {

                    throw error;

                }


                await loadMedicationRecords();

            }

            catch (error) {

                console.error(
                    "Delete Medication Error:",
                    error
                );


                const content =
                    document.getElementById(
                        "medicationRecordsContent"
                    );


                if (content) {

                    const message =
                        document.createElement(
                            "div"
                        );

                    message.className =
                        "bg-red-50 border border-red-200 " +
                        "text-red-700 rounded-xl p-4 mb-4";


                    message.textContent =
                        error.message ||
                        "Unable to delete medication.";


                    content.prepend(
                        message
                    );

                }

            }

        }

                    !authData ||
                    !authData.user
                ) {

                    window.location.href =
                        "staff-login.html";

                    return;

                }

                    authData.user;

                    error: profileError
                } =
                    await window.CHA_SUPABASE
                        .from("staff_profiles")
                        .select(`
                            id,
                            full_name,
                            role,
                            is_active,
                            department_id,
                            departments (
                                name
                            )
                        `)
                        .eq(
                            "id",
                            user.id
                        )
                        .single();


                if (profileError) {

                    throw profileError;

                }


                if (
                    !profile ||
                    profile.is_active !== true
                ) {

                    await window.CHA_SUPABASE
                        .auth
                        .signOut();

                    window.location.href =
                        "staff-login.html";

                    return;

                }


                staffName.textContent =
                    profile.full_name ||
                    "Staff Member";


                staffRole.textContent =
                    "Role: " +
                    (
                        profile.role ||
                        "Staff"
                    );


                staffDepartment.textContent =
                    "Department: " +
                    (
                        profile.departments?.name ||
                        "Not assigned"
                    );


                loading.classList.add(
                    "hidden"
                );

                pharmacyPage.classList.remove(
                    "hidden"
                );

            }

            catch (error) {

                console.error(
                    "CHA Pharmacy Error:",
                    error
                );


                loading.innerHTML = `

                    <div class="text-4xl">
                        ⚠️
                    </div>

                    <p
                        class="
                            font-bold
                            mt-3
                            text-red-700
                        "
                    >
                        Unable to load Pharmacy Department
                    </p>

                    <p
                        class="
                            text-sm
                            text-slate-500
                            mt-2
                        "
                    >
                        ${escapeHTML(
                            error.message ||
                            "Please try again."
                        )}
                    </p>

                    <button
                        type="button"
                        id="returnLoginButton"
                        class="
                            mt-5
                            bg-blue-900
                            hover:bg-blue-800
                            text-white
                            px-5
                            py-3
                            rounded-xl
                            font-bold
                        "
                    >
                        Return to Login
                    </button>

                `;


                const returnLoginButton =
                    document.getElementById(
                        "returnLoginButton"
                    );


                if (returnLoginButton) {

                    returnLoginButton.addEventListener(
                        "click",
                        function() {

                            window.location.href =
                                "staff-login.html";

                        }
                    );

                }

            }

        }



        // ====================================================
        // INITIALIZE
        // ====================================================

        loadPharmacyPage();

    </script>

</body>
</html>
